name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bunx tsc --noEmit

      # Type-check the documented consumer surface (react-jsx + jsxImportSource,
      # strict, no @types/bun). The check above runs jsx:react, so this is the
      # only gate on the automatic-runtime path consumers actually compile against.
      - run: bun run check:consumer

      # tests/webview.test.ts drives Bun.WebView, which needs a Chrome/Chromium
      # on the runner. ubuntu-latest ships google-chrome-stable; point Bun at it
      # explicitly so a future runner-image change fails loudly here, not at
      # publish time.
      - name: Locate Chrome for Bun.WebView
        run: |
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$chrome" ]; then echo "No Chrome/Chromium found on runner" >&2; exit 1; fi
          echo "BUN_CHROME_PATH=$chrome" >> "$GITHUB_ENV"

      - run: bun test

      # Bare `bun test` non-deterministically drops files under tests/ from
      # discovery, so run the WebView suite explicitly — the real-browser layer
      # must never be silently skipped behind a green check.
      - run: bun test ./tests/webview.test.ts
