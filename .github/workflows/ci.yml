name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3 # pin explicitly; else setup-bun resolves engines.bun (">=1.3.14")

      - run: bun install --frozen-lockfile

      - run: bun check

      # Type-check as consumers compile: tests/consumer-types (react-jsx and
      # jsx: react, strict, no @types/bun) and the README's files under its own
      # tsconfig with the "types": ["bun"] its server step adds.
      - run: bun run check:consumer

      # tests/webview.test.ts drives Bun.WebView, which needs a Chrome/Chromium
      # on the runner. ubuntu-latest ships google-chrome-stable; point Bun at it
      # explicitly so a future runner-image change fails loudly here, not at
      # publish time.
      - name: Locate Chrome for Bun.WebView
        run: |
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$chrome" ]; then echo "No Chrome/Chromium found on runner" >&2; exit 1; fi
          echo "BUN_CHROME_PATH=$chrome" >> "$GITHUB_ENV"

      - run: bun test

      # The WebView suite again, as its own step, so the real-browser layer shows
      # on its own. In CI a missing browser fails it rather than skipping it.
      - run: bun test ./tests/webview.test.ts

  # package.json promises Bun 1.3.14 or later (engines). Run every test but the
  # browser's on that floor; `bun check` needs the TypeScript 7 of Bun 1.4, so it isn't run here.
  # (1.3.12 and 1.3.13 pass it too, but their `bun build --compile` binaries
  # are killed on macOS arm64, so the README's one-binary deploy needs 1.3.14.)
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun test --path-ignore-patterns=tests/webview.test.ts
